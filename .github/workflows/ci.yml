name: CI

on:
  # Every pull request, whatever it targets. Pinning this to one base branch means a PR opened
  # against anything else silently runs no checks at all, which reads as green.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress
      - run: composer lint
      - run: composer analyse
      - run: composer audit:theme
      - run: composer audit:queries
      - run: composer audit:i18n
      - run: composer audit:security
      - name: The translation template is regenerable and current
        run: |
          composer make:pot
          git diff --exit-code languages/edulume.pot

  php-unit:
    name: PHP unit tests (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress
      - run: composer test:coverage
      - name: Enforce coverage floor on Domain and Application
        run: php bin/coverage-gate.php build/coverage.xml 100 90

  php-integration:
    name: WordPress integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer install --prefer-dist --no-progress
      - run: npm ci
      - run: npm run env:start
      - name: Prove WordPress is actually up
        # `npx wp-env` used to resolve to an unrelated package that printed a message and
        # exited 0, so this job reported success without ever starting WordPress. wp-env is a
        # real devDependency now, and this step fails loudly if the site is not answering —
        # a green run must never mean "did not run".
        run: npx wp-env run tests-cli wp core version
      - run: npm run test:integration

  js-quality:
    name: JS lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The performance budget and the accessibility sweep both need a running site, so they share
  # the wp-env stack rather than each paying for their own two-minute Docker start.
  site-audits:
    name: Lighthouse budget & axe sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer install --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
      - run: npm run env:start
      - name: Prove WordPress is actually up
        run: npx wp-env run cli wp core version
      - name: Activate the plugin and theme
        run: |
          npx wp-env run cli wp plugin activate edulume-core
          npx wp-env run cli wp theme activate edulume-theme
          npx wp-env run cli wp rewrite structure '/%postname%/'
      - name: Seed the demo content the audits measure against
        run: npx wp-env run cli wp edulume demo import boutique --mode=full
      - name: Lighthouse against the mobile budget
        run: npx --yes @lhci/cli@0.13.x autorun --config=lighthouserc.json
      - name: axe against every template in both modes
        run: node tools/axe/run.mjs
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

  # WPCS and Plugin Check both need dependencies that cannot be installed in every development
  # environment, so they get their own job with their own install. Either they run and pass, or
  # the job fails — neither can be silently skipped inside a green lint.
  wordpress-standards:
    name: WPCS security & Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2, cs2pr
      - run: composer install --prefer-dist --no-progress
      - name: Install the WordPress Coding Standards
        run: |
          composer require --dev --no-interaction --with-all-dependencies \
            wp-coding-standards/wpcs:^3.1 \
            dealerdirect/phpcodesniffer-composer-installer:^1.0
      - name: PHPCS with the WordPress security ruleset
        run: vendor/bin/phpcs --standard=phpcs-security.xml.dist
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Plugin Check
        run: |
          npm run env:start
          npx wp-env run cli wp core version
          npx wp-env run cli wp plugin install plugin-check --activate
          npx wp-env run cli wp plugin check edulume-core --format=table --severity=5
