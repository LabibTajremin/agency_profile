name: CI

on:
  # Every pull request, whatever it targets. Pinning this to one base branch means a PR opened
  # against anything else silently runs no checks at all, which reads as green.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress
      - run: composer lint
      - run: composer analyse
      - run: composer audit:theme
      - run: composer audit:queries
      - run: composer audit:i18n
      - name: The translation template is regenerable and current
        run: |
          composer make:pot
          git diff --exit-code languages/edulume.pot

  php-unit:
    name: PHP unit tests (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress
      - run: composer test:coverage
      - name: Enforce coverage floor on Domain and Application
        run: php bin/coverage-gate.php build/coverage.xml 100 90

  php-integration:
    name: WordPress integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer install --prefer-dist --no-progress
      - run: npm ci
      - run: npx wp-env start
      - run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/edulume-core vendor/bin/phpunit --configuration=/var/www/html/wp-content/plugins/edulume-core/phpunit-integration.xml.dist --testsuite integration

  js-quality:
    name: JS lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The performance budget and the accessibility sweep both need a running site, so they share
  # the wp-env stack rather than each paying for their own two-minute Docker start.
  site-audits:
    name: Lighthouse budget & axe sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer install --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
      - run: npx wp-env start
      - name: Seed the demo content the audits measure against
        run: npx wp-env run tests-cli wp edulume demo import boutique --mode=full
      - name: Lighthouse against the mobile budget
        run: npx --yes @lhci/cli@0.13.x autorun --config=lighthouserc.json
      - name: axe against every template in both modes
        run: node tools/axe/run.mjs
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
